services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: random-reminder-public-app

    restart: unless-stopped

    environment:
      RANDOM_REMINDER_ENV: production
      RANDOM_REMINDER_DEBUG: "false"
      RANDOM_REMINDER_HOST: 0.0.0.0
      RANDOM_REMINDER_PORT: "8000"
      RANDOM_REMINDER_LOG_LEVEL: INFO
      RANDOM_REMINDER_SESSION_COOKIE_SECURE: "true"
      RANDOM_REMINDER_TRUST_PROXY_HEADERS: "true"

      RANDOM_REMINDER_BACKUP_DIR: /app/backups
      RANDOM_REMINDER_DB_PATH: /app/data/random_reminder.db
      RANDOM_REMINDER_BACKUP_KEEP_LATEST: "30"
      RANDOM_REMINDER_BACKUP_MAX_AGE_DAYS: "90"

      RANDOM_REMINDER_VAPID_DIR: /app/secrets/vapid
      VAPID_SUBJECT: ${VAPID_SUBJECT:?Set VAPID_SUBJECT in .env.public}

    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./secrets/vapid:/app/secrets/vapid:ro

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  caddy:
    image: caddy:2.11.4-alpine

    container_name: random-reminder-public-proxy

    restart: unless-stopped

    depends_on:
      app:
        condition: service_healthy

    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env.public}
      CADDY_EMAIL: ${CADDY_EMAIL:?Set CADDY_EMAIL in .env.public}

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

    volumes:
      - ./caddy:/etc/caddy:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
