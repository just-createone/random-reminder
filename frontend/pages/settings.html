<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
<meta name="theme-color" content="#ffffff">

<title>
提醒设置
</title>


<link
rel="stylesheet"
href="/css/style.css"
>

</head>


<body class="auth-pending">


<main class="container">


<div class="page-navigation">
    <a href="/">首页</a>
    <span id="currentUserEmail" class="current-user-email"></span>
    <button id="logoutButton" class="secondary-button" type="button">退出登录</button>
</div>


<h1>
提醒设置
</h1>



<section class="card">


<h2>
基本设置
</h2>



<div class="setting-item">


<label>

<input
type="checkbox"
id="enabled"
>

开启随机提醒

</label>


</div>



</section>




<section class="card">


<h2>
提醒时间
</h2>



<div class="setting-item">


<label>

<input
type="radio"
name="timeMode"
id="allDay"
value="allDay"
>

全天提醒

</label>


</div>



<div class="setting-item">


<label>

<input
type="radio"
name="timeMode"
id="rangeTime"
value="range"
>

指定时间范围

</label>


</div>



<div
id="timeRangeContainer"
>


<label>

开始时间：

<input
type="time"
id="startTime"
>

</label>



<br>



<label>

结束时间：

<input
type="time"
id="endTime"
>

</label>


</div>



</section>




<section class="card">


<h2>
数据管理
</h2>


<p class="muted-text">
导出提醒内容和提醒设置，方便在新环境中恢复。
</p>


<div class="data-management-actions">


<button
type="button"
id="exportDataButton"
>
导出数据
</button>


</div>


<hr class="data-management-divider">


<h3>
导入数据
</h3>


<p class="muted-text">
导入会保留当前提醒、追加文件中的提醒，并恢复文件中的提醒设置。
</p>


<div class="data-management-actions">


<label
class="secondary-button"
for="importDataFile"
>
选择 JSON 文件
</label>


<input
type="file"
id="importDataFile"
class="data-management-file-input"
accept="application/json,.json"
>


<button
type="button"
id="importDataButton"
disabled
>
导入数据
</button>


</div>


<p
id="importDataFileName"
class="muted-text data-management-file-name"
>
尚未选择文件
</p>


</section>



<section class="card">


<h2>
提醒频率
</h2>



<label>

每天提醒次数：

<input
type="number"
id="timesPerDay"
min="1"
max="50"
>

</label>



<br>



<label>

最小间隔：

<input
type="number"
id="minimumInterval"
min="1"
>

分钟

</label>



</section>




<section class="card">


<button
onclick="saveSettings()"
>

保存设置

</button>



<p>

<a href="/">

返回首页

</a>

</p>


</section>



</main>




<script src="/js/api.js"></script>

<script src="/js/ui.js"></script>

<script src="/js/pwa.js"></script>

<script src="/js/auth.js"></script>

<script src="/js/modal.js"></script>

<script src="/js/settings.js"></script>


</body>

</html>
