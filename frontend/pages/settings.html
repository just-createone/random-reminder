<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>
提醒设置
</title>


<link
rel="stylesheet"
href="/css/style.css"
>

</head>


<body>


<main class="container">


<h1>
提醒设置
</h1>



<section class="card">


<h2>
基本设置
</h2>



<div class="setting-item">


<label>

<input
type="checkbox"
id="enabled"
>

开启随机提醒

</label>


</div>



</section>




<section class="card">


<h2>
提醒时间
</h2>



<div class="setting-item">


<label>

<input
type="radio"
name="timeMode"
id="allDay"
value="allDay"
>

全天提醒

</label>


</div>



<div class="setting-item">


<label>

<input
type="radio"
name="timeMode"
id="rangeTime"
value="range"
>

指定时间范围

</label>


</div>



<div
id="timeRangeContainer"
>


<label>

开始时间：

<input
type="time"
id="startTime"
>

</label>



<br>



<label>

结束时间：

<input
type="time"
id="endTime"
>

</label>


</div>



</section>




<section class="card">


<h2>
提醒频率
</h2>



<label>

每天提醒次数：

<input
type="number"
id="timesPerDay"
min="1"
max="50"
>

</label>



<br>



<label>

最小间隔：

<input
type="number"
id="minimumInterval"
min="1"
>

分钟

</label>



</section>




<section class="card">


<button
onclick="saveSettings()"
>

保存设置

</button>



<p>

<a href="/">

返回首页

</a>

</p>


</section>



</main>




<script src="/js/api.js"></script>

<script src="/js/settings.js"></script>


</body>

</html>
