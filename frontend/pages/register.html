<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>创建账户 - 随机提醒器</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/assets/icon-192.png" />
    <meta name="theme-color" content="#ffffff" />
  </head>
  <body data-auth-page="public">
    <main class="container auth-container">
      <section class="card auth-card">
        <p class="eyebrow">Random Reminder</p>
        <h1>创建账户</h1>
        <p class="muted-text">密码至少需要 8 个字符。</p>

        <form id="registerForm" class="auth-form">
          <label for="email">邮箱</label>
          <input id="email" name="email" type="email" autocomplete="email" required />

          <label for="password">密码</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required />

          <label for="confirmPassword">确认密码</label>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required />

          <button id="registerSubmitButton" type="submit">创建账户</button>
        </form>

        <p class="auth-footer">已有账户？<a href="/pages/login.html">去登录</a></p>
      </section>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/pwa.js"></script>
    <script src="/js/register.js"></script>
  </body>
</html>
