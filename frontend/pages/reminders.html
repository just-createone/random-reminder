<!DOCTYPE html>
<html lang="zh-CN">

<head>

name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>

</title>


<link
rel="stylesheet"
href="/css/style.css"
>

</head>


<body class="auth-pending">


<main class="container">


<div class="page-navigation">

    <span id="currentUserEmail" class="current-user-email"></span>
    <button id="logoutButton" class="secondary-button" type="button">退出登录</button>
</div>


<h1>
提醒管理
</h1>



<section class="card">


<h2>
新增提醒
</h2>


<div class="form-group">

id="reminderContent"
placeholder="输入你的提醒内容..."
rows="4"
></textarea>


</div>



<button
onclick="createReminder()"
>
添加提醒
</button>



</section>




<section class="card">


<h2>
我的提醒
</h2>


<div id="reminderList">

加载中...

</div>


</section>




<section class="card">

<a href="/">
返回首页

</a>

</section>



</main>




<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/auth.js"></script>

</body>

</html>
