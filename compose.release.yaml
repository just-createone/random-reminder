services:
  app:
    image: ghcr.io/just-createone/random-reminder:0.1.0

    container_name: random-reminder-release

    restart: unless-stopped

    environment:
      RANDOM_REMINDER_ENV: production
      RANDOM_REMINDER_DEBUG: "false"
      RANDOM_REMINDER_HOST: 0.0.0.0
      RANDOM_REMINDER_PORT: "8000"
      RANDOM_REMINDER_LOG_LEVEL: INFO

      RANDOM_REMINDER_DB_PATH: /app/data/random_reminder.db
      RANDOM_REMINDER_VAPID_DIR: /app/secrets/vapid

      VAPID_SUBJECT: mailto:admin@example.com

    ports:
      - "8000:8000"

    volumes:
      - ./data:/app/data
      - ./secrets/vapid:/app/secrets/vapid:ro

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3