services:
  app:
    image: ${RANDOM_REMINDER_IMAGE}

    container_name: random-reminder-release

    restart: unless-stopped

    environment:
      RANDOM_REMINDER_ENV: production
      RANDOM_REMINDER_DEBUG: "false"
      RANDOM_REMINDER_HOST: 0.0.0.0
      RANDOM_REMINDER_PORT: "8000"
      RANDOM_REMINDER_LOG_LEVEL: ${RANDOM_REMINDER_LOG_LEVEL}

      RANDOM_REMINDER_DB_PATH: /app/data/random_reminder.db
      RANDOM_REMINDER_VAPID_DIR: /app/secrets/vapid

      VAPID_SUBJECT: ${VAPID_SUBJECT}

    ports:
      - "${RANDOM_REMINDER_HOST_PORT}:8000"

    volumes:
      - ./data:/app/data
      - ./secrets/vapid:/app/secrets/vapid:ro

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3